name: Publish Docs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-docs.yml
      - common.mk
      - versions.mk
      - docs/**
      - hack/tools/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish mdBook to Cloudflare R2
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.CLOUDFLARE_R2_DOCS_BUCKET }}
      R2_PREFIX: ${{ vars.CLOUDFLARE_R2_DOCS_PREFIX }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Build docs
        run: make -C docs build

      - name: Publish docs
        run: |
          set -euo pipefail

          if [ -z "${R2_ENDPOINT}" ]; then
            if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
              echo "CLOUDFLARE_ACCOUNT_ID repository variable is required when CLOUDFLARE_R2_ENDPOINT is not set" >&2
              exit 1
            fi
            R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          fi
          if [ -z "${R2_BUCKET}" ]; then
            echo "CLOUDFLARE_R2_DOCS_BUCKET repository variable is required" >&2
            exit 1
          fi

          destination="s3://${R2_BUCKET}"
          if [ -n "${R2_PREFIX}" ]; then
            destination="${destination}/${R2_PREFIX#/}"
          fi

          aws s3 sync docs/book "${destination}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --delete \
            --cache-control "public, max-age=300"
